name: Prediction paper tests
on:
  pull_request:
    paths:
      - 'prediction_paper/**'
      - 'tests/test_prediction*'
      - 'prediction-config.json'
      - '.github/workflows/prediction-paper.yml'
  push:
    branches: [main, codex/prediction-paper-bot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_prediction*.py' -v
      - run: python -m prediction_paper.cli demo
