name: Paper trading regression tests
on:
  push:
    branches: [main, codex/options-paper-foundation, codex/trading-automation-hardening, codex/paper-worker-reliability]
  pull_request:
    branches: [main, codex/options-paper-foundation, codex/trading-automation-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -W ignore::ResourceWarning -m unittest discover -s tests -v
        working-directory: coinbase_paper
      - run: python -m options_paper.demo
      - run: python -m prediction_paper.cli demo
      - run: python -m trading_ops.demo
      - run: python -m trading_ops.worker --state-dir "$RUNNER_TEMP/paper-operations" --prediction-config prediction-config.json

